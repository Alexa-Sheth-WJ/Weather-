  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .app { width:100%; max-width:520px; aspect-ratio:4 / 3; display:flex; flex-direction:column; overflow:hidden; margin:0 auto; position:relative; }
  header { display:flex; align-items:center; gap:2px; padding:8px 10px 5px; flex:none; }
  .place { flex:1; min-width:0; }
  .place h1 { font-family:var(--serif); font-size:15px; font-weight:600; margin:0; line-height:1.2; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .place p { margin:0; font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hbtn { width:24px; height:24px; border-radius:6px; display:grid; place-items:center; color:var(--muted); font-size:11px; font-weight:600; }
  .hbtn:hover { background:var(--surface); color:var(--text); }
  nav { display:flex; margin:0 10px; padding:2px; background:var(--surface); border-radius:7px; flex:none; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  nav button { flex:1; padding:3px 0; border-radius:5px; font-size:11px; font-weight:500; color:var(--muted); }
  nav button[aria-selected="true"] { background:var(--tab-on); color:var(--text); box-shadow:inset 0 -2px 0 var(--accent); }
  .hidden { display:none !important; }
  main { flex:1; min-height:0; overflow:hidden; padding:8px 10px; display:flex; flex-direction:column; }
  .status { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--muted); gap:8px; }
  .today { display:flex; flex-direction:column; gap:10px; min-height:0; }
  .now { display:flex; align-items:center; gap:8px; }
  .now .icon { font-size:36px; line-height:1; filter:drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
  .now .temp { font-family:var(--serif); font-size:34px; font-weight:600; line-height:1; letter-spacing:-.5px; }
  .now .desc { color:var(--muted); font-size:11px; margin-top:2px; }
  .section { font-size:10px; font-weight:600; color:var(--muted); letter-spacing:.02em; margin:0 0 4px; }
  .strip { display:flex; gap:3px; }
  .cell { flex:1; min-width:0; text-align:center; background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:4px 0; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .cell small { display:block; font-size:10px; color:var(--muted); }
  .cell .e { font-size:15px; line-height:1.3; }
  .cell b { font-size:11px; }
  .cell .p { font-size:9px; color:var(--rain); min-height:11px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; column-gap:12px; }
  .stat { display:flex; justify-content:space-between; gap:4px; padding:4px 0; border-bottom:1px solid var(--border); white-space:nowrap; }
  .stat small { font-size:11px; color:var(--muted); }
  .stat b { font-size:11px; font-weight:600; }
  .list { flex:1; display:flex; flex-direction:column; min-height:0; --cols:42px 18px 28px 40px 22px 1fr 24px; }
  .list-head { display:grid; grid-template-columns:var(--cols); gap:5px; font-size:10px; color:var(--muted); padding-bottom:3px; border-bottom:1px solid var(--border); }
  .list-head .r { text-align:right; }
  .rows { flex:1; display:flex; flex-direction:column; min-height:0; }
  .day { flex:1; min-height:0; max-height:38px; display:grid; grid-template-columns:var(--cols); gap:5px; align-items:center; border-bottom:1px solid var(--border); }
  .day:last-child { border-bottom:0; }

<body>
<div class="app">
  <header>
    <div class="place">
      <h1 id="placeName">Weather</h1>
      <p id="placeSub">&nbsp;</p>
    </div>
    <button class="hbtn hidden" id="unitBtn" title="Switch units">°C</button>
    <button class="hbtn hidden" id="refreshBtn" title="Refresh">↻</button>
  </header>
  <nav class="hidden" id="tabs" role="tablist">
    <button role="tab" data-tab="past" id="pastTab">Past 7</button>
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="next">Next 7</button>
  </nav>
  <main id="main"></main>
  <footer id="credit" class="hidden"></footer>
</div>

<script>
// ---------- configuration ----------
var ENDPOINT = "https://029deac2-5967-4594-a87d-a5009a2da1f7.integration-hook.com";
var REFRESH_MS = 15 * 60 * 1000;            // matches the 15-minute cache in Tray

// WorkJam location (replaced by WorkJam, or passed as ?city=&region=&country= on the iframe URL)
var INPUT = { city: "{$.steps.trigger.query.city}", region: "{$.steps.trigger.query.region}", country: "{$.steps.trigger.query.country}" };

(function () {
  var HOUR = 36e5;
  var $ = function (id) { return document.getElementById(id); };
  var main = $("main");
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // Ignore empty values and placeholders that were never filled in
  function param(name) {
    var ok = function (v) { v = (v == null ? "" : String(v)).trim(); return !v || /^__WJ_\w+__$|\{\{.*\}\}|\{\$.*\}/.test(v) ? "" : v; };
    return ok(INPUT[name]) || ok(new URLSearchParams(location.search).get(name));
  }
  var query = { city: param("city"), region: param("region"), country: param("country") };
  var cacheKey = "wx:" + [query.city, query.region, query.country].join("|").toLowerCase();

  var state = { r: null, tab: "today", fahrenheit: null };
  var savedUnit = store.get("wx-unit"); if (savedUnit) state.fahrenheit = savedUnit === "F";
  var savedTab = store.get("wx-tab"); if (["past", "today", "next"].indexOf(savedTab) >= 0) state.tab = savedTab;

  // ---------- formatting ----------
  var F = function () { return state.fahrenheit; };
  var toT = function (c) { return c == null ? null : F() ? c * 9 / 5 + 32 : c; };
  var deg = function (c) { return c == null ? "–" : Math.round(toT(c)) + "°"; };
  var speed = function (ms) { return ms == null ? "–" : Math.round(F() ? ms * 2.23694 : ms * 3.6); };
  var amount = function (mm) { return mm == null ? "–" : (F() ? mm / 25.4 : mm).toFixed(F() ? 2 : 1); };
  var units = function () { return { t: F() ? "°F" : "°C", w: F() ? "mph" : "km/h", p: F() ? "in" : "mm" }; };
  var tz = function () { return state.r.data.location.tz; };
  var parseDay = function (s) { var a = s.split("-").map(Number); return new Date(a[0], a[1] - 1, a[2]); };
  var shortDate = function (s) { return parseDay(s).toLocaleDateString("en", { month: "short", day: "numeric" }); };
  var weekday = function (s) { return parseDay(s).toLocaleDateString("en", { weekday: "short" }); };
  var rangeLabel = function (a, b) { return a.slice(0, 7) === b.slice(0, 7) ? shortDate(a) + "–" + parseDay(b).getDate() : shortDate(a) + " – " + shortDate(b); };
  var clock = function (ms) { return ms ? new Date(ms).toLocaleTimeString("en", { hour: "numeric", minute: "2-digit", timeZone: tz() }) : "–"; };
  var hourLabel = function (ms) { return new Date(ms).toLocaleTimeString("en", { hour: "numeric", timeZone: tz() }).replace(" ", "").toLowerCase(); };
  var compass = function (d) { return d == null ? "" : ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(d / 45) % 8]; };
  var arrow = function (d) { return d == null ? "" : '<span class="arrow" style="transform:rotate(' + Math.round(d) + 'deg)" aria-hidden="true">↓</span>'; };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var cap = function (s) { return s ? s[0].toUpperCase() + s.slice(1).toLowerCase() : s; };

  function wx(code) {
    if (!code) return { label: "—", icon: "·" };
    var night = /_night$/.test(code), base = code.replace(/_(day|night|polartwilight)$/, "");
    var simple = {
      clearsky: [night ? "Clear" : "Sunny", night ? "🌙" : "☀️"], fair: [night ? "Mostly clear" : "Mostly sunny", night ? "🌙" : "🌤️"],
      partlycloudy: ["Partly cloudy", night ? "☁️" : "⛅"], cloudy: ["Cloudy", "☁️"], fog: ["Fog", "🌫️"],
      haze: ["Haze", "🌫️"], smoke: ["Smoke", "🌫️"], windy: ["Windy", "💨"], dry: ["Dry", "·"]
    };
    if (simple[base]) return { label: simple[base][0], icon: simple[base][1] };
    var m = base.match(/^(light|heavy)?(rain|sleet|snow|drizzle|freezingrain)(showers)?(andthunder)?$/);
    if (!m) return { label: base, icon: "🌡️" };
    var level = m[1], type = m[2], showers = m[3], thunder = m[4];
    var tn = type === "freezingrain" ? "freezing rain" : type;
    var label = thunder && !level && !showers ? "Thunderstorms" : [level, tn, showers && "showers"].filter(Boolean).join(" ") + (thunder ? " & thunder" : "");
    var icon = thunder ? "⛈️" : type === "snow" ? (level === "heavy" ? "❄️" : "🌨️") : type === "sleet" || type === "freezingrain" ? "🌨️" : (showers || type === "drizzle") && !night ? "🌦️" : "🌧️";
    return { label: label[0].toUpperCase() + label.slice(1), icon: icon };
  }

  // ---------- status screens ----------
  function showStatus(msg, spinner) {
    main.innerHTML = '<div class="status">' + (spinner ? '<div class="spinner"></div>' : "") + "<div>" + msg + "</div></div>";
  }
  function showError(msg) {
    ["tabs", "unitBtn", "credit"].forEach(function (id) { $(id).classList.add("hidden"); });
    $("refreshBtn").classList.remove("hidden");
    $("placeName").textContent = "Weather";
    $("placeSub").innerHTML = "&nbsp;";
    showStatus("<b>Weather unavailable</b><br>" + esc(msg));
  }

  // ---------- rendering ----------
  function renderHeader() {
    var r = state.r, p = r.place, d = r.data;
    $("placeName").textContent = [p.city, p.region !== p.city && p.region].filter(Boolean).join(", ") || "Your area";
    var order = ["severe", "moderate", "minor"];
    var w = (d.warnings || []).filter(function (x) { return !x.until || x.until > Date.now(); })
      .sort(function (a, b) { return order.indexOf(a.level) - order.indexOf(b.level); });
    var sub = $("placeSub");
    if (w.length) {
      var more = w.length > 1 ? " +" + (w.length - 1) : "";
      sub.className = "alert " + w[0].level;
      var tip = w.map(function (x) { return cap(x.title) + (x.until ? " — until " + clock(x.until) : ""); }).join("\n");
      sub.innerHTML = '<a href="' + esc(w[0].url || "#") + '" target="_blank" rel="noopener" title="' + esc(tip) + '">⚠ ' + esc(cap(w[0].title)) + more + "</a>";
    } else {
      sub.className = "";
      sub.textContent = [p.country, r.source].filter(Boolean).join(" · ");
    }
    $("unitBtn").textContent = F() ? "°F" : "°C";
    var link = function (c) { return '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.text) + "</a>"; };
    $("credit").innerHTML = (d.credit ? link(d.credit) + " · " : "") + link({ text: "© OSM", url: "https://www.openstreetmap.org/copyright" });
    var hasPast = Array.isArray(d.pastDays) && d.pastDays.length > 0;
    $("pastTab").classList.toggle("hidden", !hasPast);
    if (!hasPast && state.tab === "past") state.tab = "today";
    ["tabs", "unitBtn", "refreshBtn", "credit"].forEach(function (id) { $(id).classList.remove("hidden"); });
    document.querySelectorAll("nav button").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.tab === state.tab); });
  }

  function renderToday() {
    var d = state.r.data, c = d.current, t = d.today, u = units(), w = wx(c.symbol), cells = "";
    // Drop hours that have already passed since the data was built
    var from = Math.floor(Date.now() / HOUR) * HOUR;
    var hrs = (d.hours || []).filter(function (h) { return h.time >= from; });
    for (var k = 0; k < 6; k++) {
      var h = hrs[k * 2];
      if (!h) break;
      var hw = wx(h.symbol);
      cells += '<div class="cell"><small>' + (k === 0 ? "Now" : hourLabel(h.time)) + '</small><div class="e" title="' + hw.label + '">' + hw.icon + "</div><b>" + deg(h.temp) + "</b>" +
        '<div class="p">' + (h.pop != null && h.pop >= 20 ? Math.round(h.pop) + "%" : "") + "</div></div>";
    }
    var S = function (label, value) { return { label: label, value: value }; };
    var rainToday = t.precip != null ? S("Rain today", amount(t.precip) + " " + u.p) : null;
    var pressure = c.pressure != null ? S("Pressure", Math.round(c.pressure) + " hPa") : null;
    var dew = c.dewPoint != null ? S("Dew point", deg(c.dewPoint)) : null;
    var humidity = c.humidity != null ? S("Humidity", Math.round(c.humidity) + "%") : null;
    var pool = [
      S("Feels like", deg(c.feels)),
      S("Wind", arrow(c.windDir) + " " + compass(c.windDir) + " " + speed(c.wind) + " " + u.w),
      t.pop != null ? S("Rain chance", Math.round(t.pop) + "%") : rainToday,
      c.gust != null ? S("Gusts", speed(c.gust) + " " + u.w) : pressure,
      humidity,
      c.cloud != null ? S("Cloud cover", Math.round(c.cloud) + "%") : null,
      S("Sunrise", clock(t.sunrise)), S("Sunset", clock(t.sunset)),
      c.uv != null ? S("UV index", Math.round(c.uv)) : null,
      rainToday, pressure, dew
    ];
    var items = [];
    pool.forEach(function (x) { if (x && items.indexOf(x) < 0 && items.length < 10) items.push(x); });
    if (items.length % 2) items.pop();
    main.innerHTML = '<div class="today"><div class="now"><span class="icon">' + w.icon + "</span><div>" +
      '<div class="temp">' + (c.temp == null ? "–" : Math.round(toT(c.temp)) + u.t) + "</div>" +
      '<div class="desc">' + w.label + " · H " + deg(t.hi) + " L " + deg(t.lo) + "</div></div></div>" +
      '<div class="hours"><div class="section">Next 12 hours</div><div class="strip">' + cells + "</div></div>" +
      '<div class="stats">' + items.map(function (s) { return '<div class="stat"><small>' + s.label + "</small><b>" + s.value + "</b></div>"; }).join("") + "</div></div>";
  }

  function renderDays(days, past) {
    days = (days || []).slice();
    while (!past && days.length && days[days.length - 1].missing) days.pop();   // trim trailing empty forecast days
    var u = units(), have = days.filter(function (d) { return !d.missing && d.hi != null; });
    if (!have.length) {
      main.innerHTML = '<div class="status"><div><b>No data</b><br>' + (past ? "Past days aren’t available for this location." : "Forecast unavailable right now.") + "</div></div>";
      return;
    }
    var usePop = !past && have.some(function (d) { return d.pop != null; });
    var showRain = usePop || have.some(function (d) { return d.precip != null; });
    var useGust = have.some(function (d) { return d.gust != null; });
    var useWind = useGust || have.some(function (d) { return d.wind != null; });
    var min = Math.min.apply(null, have.map(function (d) { return d.lo != null ? d.lo : d.hi; }));
    var max = Math.max.apply(null, have.map(function (d) { return d.hi; })), span = max - min || 1;
    var rows = days.map(function (d, i) {
      var name = past && i === days.length - 1 ? "Yest." : weekday(d.date);
      var dateCol = '<span class="d"><b>' + name + "</b><small>" + shortDate(d.date) + "</small></span>";
      if (d.missing || d.hi == null) return '<div class="day" title="No data">' + dateCol + '<span class="e">·</span><span class="pg"><span class="p"></span><span class="g">–</span></span><span class="lo">–</span><span class="bar"></span><span class="hi">–</span></div>';
      var w = wx(d.symbol), lo = d.lo != null ? d.lo : d.hi;
      var left = (lo - min) / span * 100, width = Math.max((d.hi - lo) / span * 100, 4);
      var rain = usePop ? (d.pop >= 20 ? Math.round(d.pop) + "%" : "") : d.precip > 0 ? amount(d.precip) : "";
      var wv = useGust ? (d.gust != null ? d.gust : d.wind) : d.wind;
      var tip = w.label + (useWind ? " · " + (useGust ? "Max gust" : "Max wind") + " " + speed(wv) + " " + u.w : "") + (d.windDir != null ? ", mostly from the " + compass(d.windDir) : "");
      return '<div class="day" title="' + tip + '">' + dateCol + '<span class="e">' + w.icon + "</span>" +
        '<span class="pg"><span class="p">' + rain + '</span><span class="g">' + (useWind ? arrow(d.windDir) + " " + speed(wv) : "") + "</span></span>" +
        '<span class="lo">' + deg(d.lo) + '</span><span class="bar"><i style="left:' + left + "%;width:" + width + '%"></i></span><span class="hi">' + deg(d.hi) + "</span></div>";
    }).join("");
    main.innerHTML = '<div class="list"><div class="list-head"' + (past ? ' title="Measured at the nearest weather station"' : "") + ">" +
      '<span style="grid-column:1/3;white-space:nowrap">' + rangeLabel(days[0].date, days[days.length - 1].date) + "</span>" +
      '<span class="pg"><span class="r">' + (showRain ? (usePop ? "Rain" : u.p) : "") + "</span><span>" + (useWind ? (useGust ? "Gust" : "Wind") : "") + '</span></span><span class="r">Low</span><span></span><span>High</span></div>' +
      '<div class="rows">' + rows + "</div></div>";
  }

  function render() {
    if (!state.r) return;
    if (state.fahrenheit == null) state.fahrenheit = state.r.place.countryCode === "US";
    renderHeader();
    if (state.tab === "next") renderDays(state.r.data.next, false);
    else if (state.tab === "past") renderDays(state.r.data.pastDays, true);
    else renderToday();
  }

  // ---------- data ----------
  var loading = false;
  function load(quiet) {
    if (!query.city || !query.region || !query.country) { showError("No work location was provided for this widget."); return; }
    if (loading) return;
    loading = true;
    if (!quiet) showStatus("Loading weather…", true);
    var url = ENDPOINT + "?city=" + encodeURIComponent(query.city) + "&region=" + encodeURIComponent(query.region) + "&country=" + encodeURIComponent(query.country);
    fetch(url, { credentials: "omit" })
      .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .then(function (r) {
        if (r && r.result && r.result.data) r = r.result;            // tolerate a wrapped reply
        if (!r || r.ok === false || !r.data || !r.place) {
          if (!state.r) showError((r && r.error && r.error.message) || "We couldn’t find weather for this location.");
          return;
        }
        state.r = r;
        store.set(cacheKey, r);
        render();
      })
      .catch(function () {
        if (!state.r) showError("The weather service isn’t responding right now. Try again later.");
      })
      .then(function () { loading = false; });
  }

  // ---------- events ----------
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tab]");
    if (!b || !state.r) return;
    state.tab = b.dataset.tab; store.set("wx-tab", state.tab); render();
  });
  $("unitBtn").addEventListener("click", function () {
    state.fahrenheit = !state.fahrenheit; store.set("wx-unit", state.fahrenheit ? "F" : "C"); render();
  });
  $("refreshBtn").addEventListener("click", function () { load(!!state.r); });

  // ---------- layout: aspect ratio from ?aspectRatio=, density tiers by height ----------
  var RATIOS = { standard: "4 / 3", square: "1 / 1", landscape: "16 / 9", portrait: "9 / 16" };
  var appEl = document.querySelector(".app");
  appEl.style.aspectRatio = RATIOS[new URLSearchParams(location.search).get("aspectRatio")] || RATIOS.standard;
  function tiers() {
    var h = appEl.getBoundingClientRect().height, T = function (c, on) { appEl.classList.toggle(c, on); };
    T("t-470", h >= 470); T("t-470-579", h >= 470 && h <= 579); T("t-399", h <= 399); T("t-339", h <= 339);
    T("t-299", h <= 299); T("t-249", h <= 249); T("t-239", h <= 239); T("t-209", h <= 209); T("t-184", h <= 184);
  }
